server:
  port: ${PORT:8080}

spring:
  quartz:
    properties:
      org:
        quartz:
          threadPool:
            threadCount: ${QUARTZ_THREAD_COUNT:10}
          jobStore:
            isClustered: 'true'
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
            tablePrefix: ${DB_SCHEMA:scheduler}.qrtz_
          scheduler:
            instanceName: ilm-scheduler
            instanceId: AUTO
    jdbc:
      initialize-schema: never
    job-store-type: jdbc
  messaging:
    broker-type: ${BROKER_TYPE:RABBITMQ}
    broker-url: ${BROKER_URL:}
    # Legacy RabbitMQ connection properties (used if broker-url is not set)
    host: ${BROKER_HOST:}
    port: ${BROKER_PORT:5672}
    pool:
      max-connections: ${BROKER_POOL_MAX_CONNECTIONS:1}
      connection-idle-timeout: ${BROKER_POOL_CONNECTION_IDLE_TIMEOUT:30000}
      connection-check-interval: ${BROKER_POOL_CONNECTION_CHECK_INTERVAL:60000}
      max-sessions-per-connection: ${BROKER_POOL_MAX_SESSIONS:500}
      use-anonymous-producers: ${BROKER_POOL_USE_ANONYMOUS_PRODUCERS:true}
    # Authentication - RabbitMQ requires username/password, ServiceBus requires either username/password (SAS) or AAD
    username: ${BROKER_USERNAME:}
    password: ${BROKER_PASSWORD:}
    # Azure Active Directory (Entra) authentication for ServiceBus
    aad-auth:
      tenant-id: ${BROKER_AZURE_TENANT_ID:}
      client-id: ${BROKER_AZURE_CLIENT_ID:}
      client-secret: ${BROKER_AZURE_CLIENT_SECRET:}
    virtual-host: ${BROKER_VIRTUAL_HOST:/}
    exchange: ${BROKER_EXCHANGE:ilm}
    routing-key:
      scheduler: ${BROKER_ROUTING_KEY_SCHEDULER:scheduler}
  jpa:
    generate-ddl: 'true'
    hibernate:
      ddl-auto: update
    properties:
      hibernate.default_schema: ${DB_SCHEMA:scheduler}
  liquibase:
    change-log: classpath:/db/migration/db.changelog-master.xml
    default-schema: ${DB_SCHEMA:scheduler}
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      # Sized for this service rather than copied from core. The only sustained user of this pool is
      # the Quartz job store: the worker threads above, plus the cluster check-in and misfire handler
      # threads -- around thirteen at peak -- so twenty is headroom, not a ceiling to grow into.
      #
      # minimumIdle is set below maximumPoolSize, which HikariCP does not do by default and advises
      # against for request-serving applications. This service is the opposite of that: mostly idle
      # between fires, with brief bursts. Holding twenty connections open per replica would reserve
      # them from every other service on the same database, and pools multiply by replica.
      #
      # Job data can carry values that must not reach the log. PostgreSQL answers a constraint
      # violation with a DETAIL line quoting the whole failing row and pgjdbc copies it into the
      # exception message; SchedulerServiceImpl logs the SchedulerException with its cause, so the
      # message reaches the log intact. The constraint name survives this setting.
      data-source-properties:
        logServerErrorDetail: false
      connectionTimeout: ${CONNECTION_POOL_CONNECTION_TIMEOUT:30000}
      idleTimeout: ${CONNECTION_POOL_IDLE_TIMEOUT:600000}
      maxLifetime: ${CONNECTION_POOL_MAX_LIFETIME:1800000}
      maximumPoolSize: ${CONNECTION_POOL_MAX_POOL_SIZE:20}
      minimumIdle: ${CONNECTION_POOL_MIN_IDLE:5}
      schema: ${DB_SCHEMA:scheduler}
    password: ${JDBC_PASSWORD}
    url: ${JDBC_URL}
    username: ${JDBC_USERNAME}

management:
  endpoints:
    web:
      base-path: '/'
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
